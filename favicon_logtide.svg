<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="30" fill="#080c10" stroke="#00e5a0" stroke-width="1" opacity="0.9"/>

  <!-- Wave -->
  <path d="M6,46 Q12,38 18,42 Q24,46 30,38 Q36,30 42,34 Q48,38 54,30 Q58,24 62,27" fill="none" stroke="#00e5a0" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Wings left -->
  <path d="M32,36 Q22,24 16,14 Q22,24 25,32 Q19,20 23,12 Q28,22 30,30" fill="none" stroke="#00e5a0" stroke-width="1.8" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Wings right -->
  <path d="M32,36 Q42,24 48,14 Q42,24 39,32 Q45,20 41,12 Q36,22 34,30" fill="none" stroke="#00e5a0" stroke-width="1.8" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Body -->
  <path d="M30,35 Q29,40 30,48 Q31.5,44 32,41 Q32.5,44 34,48 Q35,40 34,35Z" fill="#00e5a0" opacity="0.9"/>

  <!-- Head -->
  <circle cx="32" cy="30" r="5" fill="none" stroke="#00e5a0" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="32" cy="30" r="2" fill="#00e5a0"/>

  <!-- Crest -->
  <path d="M30,26 Q28,19 29,14" fill="none" stroke="#00e5a0" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M32,25 Q32,18 32,13" fill="none" stroke="#00e5a0" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M34,26 Q36,19 35,14" fill="none" stroke="#00e5a0" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Sparks -->
  <circle cx="14" cy="40" r="1.5" fill="#00e5a0" opacity="0.5"/>
  <circle cx="50" cy="34" r="1.2" fill="#00e5a0" opacity="0.45"/>
  <circle cx="22" cy="48" r="1" fill="#00e5a0" opacity="0.35"/>
</svg>