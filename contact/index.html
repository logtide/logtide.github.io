<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>logtide — contact</title>
  <style>
    :root { --w: 860px; }
    body { margin: 0; font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; line-height: 1.55; }
    .wrap { max-width: var(--w); margin: 52px auto; padding: 0 18px; }
    nav { display: flex; gap: 16px; margin-bottom: 28px; font-size: 14px; }
    nav a { color: inherit; text-decoration: none; opacity: .8; }
    nav a:hover { opacity: 1; text-decoration: underline; }
    h1 { margin: 0 0 10px 0; font-size: 28px; letter-spacing: .2px; }
    p { margin: 0 0 14px 0; }
    .muted { opacity: .75; font-size: 14px; }
    label { display:block; margin: 12px 0 6px; font-size: 14px; opacity: .85; }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(127,127,127,.35);
      border-radius: 10px;
      background: transparent;
      color: inherit;
      font-size: 14px;
      outline: none;
    }
    textarea { min-height: 140px; resize: vertical; }
    button {
      margin-top: 12px;
      padding: 10px 14px;
      border: 1px solid rgba(127,127,127,.35);
      border-radius: 10px;
      background: transparent;
      color: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { border-color: rgba(127,127,127,.7); }
    .row { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
    @media (max-width: 720px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <a href="/">Home</a>
      <a href="/work/">Work</a>
      <a href="/projects/">Projects</a>
      <a href="/contact/">Contact</a>
    </nav>

    <h1>Contact</h1>
    <p class="muted">Send a message here — it goes straight to my inbox.</p>

    <form action="https://formspree.io/f/xdkqrqda" method="POST">
      <!-- Redirect back to your own thank-you page -->
      <input type="hidden" name="_redirect" value="https://logtide.github.io/contact/thanks.html">

      <!-- Basic spam trap (humans won't fill it) -->
      <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off" />

      <div class="row">
        <div>
          <label for="name">Name</label>
          <input id="name" name="name" autocomplete="name" required />
        </div>
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>
      </div>

      <label for="subject">Subject</label>
      <input id="subject" name="subject" required />

      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>

      <button type="submit">Send</button>
    </form>
  </div>
</body>
</html>
