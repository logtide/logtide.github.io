<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>logtide — message sent</title>
  <style>
    :root { --w: 860px; }
    body { margin: 0; font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; line-height: 1.55; }
    .wrap { max-width: var(--w); margin: 52px auto; padding: 0 18px; }
    nav { display: flex; gap: 16px; margin-bottom: 28px; font-size: 14px; }
    nav a { color: inherit; text-decoration: none; opacity: .8; }
    nav a:hover { opacity: 1; text-decoration: underline; }
    .box { border: 1px solid rgba(127,127,127,.25); border-radius: 12px; padding: 14px; }
    .muted { opacity: .75; font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <a href="/">Home</a>
      <a href="/work/">Work</a>
      <a href="/projects/">Projects</a>
      <a href="/contact/">Contact</a>
    </nav>

    <h1>Message sent</h1>
    <div class="box">
      <p style="margin:0 0 8px 0;">Thanks — I got it.</p>
      <p class="muted" style="margin:0;">If you don’t hear back soon, feel free to follow up.</p>
    </div>

    <p style="margin-top:16px;"><a href="/">← Back to home</a></p>
  </div>
</body>
</html>
